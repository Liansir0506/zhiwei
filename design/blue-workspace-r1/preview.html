const state={page:'home',resourceTab:'告警',queryTab:'常用统计',knowledgeTab:'知识浏览',flow:0,uploadStep:0,filename:'',queryReady:false,queryDone:false,chat:[],completed:false};let trigger=null,toastTimer;

const alarms=[['AMF 注册成功率下降','AMF-02 · 核心网','紧急','red','待确认','10:24'],['SCTP 关联异常','gNodeB-08 · 无线接入','重要','orange','处理中','10:18'],['传输链路丢包升高','SPN-03 · 传输网','重要','orange','恢复观察','09:56'],['DNS 解析耗时升高','DNS-01 · 核心网','次要','blue','待确认','09:42'],['上行吞吐下降','gNodeB-12 · 无线接入','次要','blue','待确认','09:31']];
function home(){return head('工作台','今天有 3 项任务需要你关注。',btn(icon('plus')+' 新建诊断','diagnose',true))+`<div class="metrics">${[['待处理告警','48','较上一窗口减少 12 条','activity'],['处理中工单','7','其中 2 项等待恢复验证','clock'],['待审核资料','3','来自已处理案例与资料上传','file'],['设备在线率','99.2','248 / 250 台在线','device']].map((m,i)=>`<div class="card metric"><div class="metric-top">${m[0]}<span class="metric-icon">${icon(m[3])}</span></div><strong>${m[1]}${i===3?'<em>%</em>':''}</strong><div class="trend">${m[2]}</div></div>`).join('')}</div><div class="dashboard-grid"><div><div class="card"><div class="card-head"><h2>我的待办 <span class="muted" style="font-size:12px;font-weight:400;margin-left:7px">3</span></h2><button class="link" data-page="alerts">查看全部 ${icon('arrow')}</button></div>${[['AMF 注册成功率下降','等待确认原因并创建处置工单','开始排查','diagnose','activity'],['传输链路丢包恢复验证','已完成处理，等待填写观察结果','继续验证','observe','clock'],['AMF 故障处理案例','工单已关闭，可整理为知识资料','查看案例','case','file']].map((t,i)=>`<div class="todo-row"><div class="task-icon ${i===1?'warn':''}">${icon(t[4])}</div><div><div class="task-title">${t[0]}</div><p>${t[1]}</p></div><button class="btn sm ${i===0?'primary':''}" data-action="${t[3]}">${t[2]}</button></div>`).join('')}</div><div class="quick-card card"><h2>常用入口</h2><div class="quick-links"><button data-page="chat">${icon('spark')}　查运维知识</button><button data-page="query">${icon('chart')}　查询业务数据</button><button data-action="upload">${icon('upload')}　上传新资料</button></div></div></div><div class="card"><div class="card-head"><h2>告警趋势</h2><span class="small">最近 7 天</span></div><div class="trend-wrap"><div style="font-size:12px;color:#8c99ae;margin-bottom:16px">新增告警 <strong style="font-size:25px;color:#344b6c;margin:0 7px;font-weight:600">126</strong>条</div>${chart()}<div class="chart-labels"><span>10.15</span><span>10.17</span><span>10.19</span><span>10.21</span></div><div class="chart-desc"><span>峰值 28 条 / 天</span><button class="link" data-page="alerts">查看明细</button></div></div></div></div>`+footer()}
function alertPage(){let content='';if(state.resourceTab==='告警'){content=`<thead><tr><th>告警 / 设备</th><th>级别</th><th>处理阶段</th><th>发生时间</th><th></th></tr></thead><tbody>${alarms.map((a,i)=>`<tr data-alarm="${i}" tabindex="0" aria-label="查看${a[0]}"><td><strong>${a[0]}</strong><small>${a[1]}</small></td><td>${pill(a[2],a[3])}</td><td>${pill(i===0&&state.completed?'已解决':a[4],i===0&&state.completed?'green':'blue')}</td><td>${a[5]}</td><td><button class="link" data-alarm="${i}">查看 ${icon('arrow')}</button></td></tr>`).join('')}</tbody>`}else if(state.resourceTab==='工单'){content=`<thead><tr><th>工单</th><th>负责人</th><th>状态</th><th>更新时间</th><th></th></tr></thead><tbody><tr data-action="observe"><td><strong>AMF 注册异常处置</strong><small>关联 AMF-02 · 高优先级</small></td><td>当前运维人员</td><td>${pill('处理中')}</td><td>10:28</td><td><button class="link" data-action="observe">继续处理 →</button></td></tr></tbody>`}else if(state.resourceTab==='设备'){content=`<thead><tr><th>设备</th><th>类型</th><th>软件版本</th><th>状态</th><th></th></tr></thead><tbody>${[['AMF-02','核心网','R2.4'],['gNodeB-08','无线接入','V3.2'],['SPN-03','传输网','V2.1']].map(a=>`<tr data-action="diagnose"><td><strong>${a[0]}</strong></td><td>${a[1]}</td><td>${a[2]}</td><td>${pill('在线','green')}</td><td><button class="link" data-action="diagnose">排查问题 →</button></td></tr>`).join('')}</tbody>`}else{content=`<thead><tr><th>诊断任务</th><th>对象</th><th>结果</th><th>时间</th><th></th></tr></thead><tbody><tr data-action="diagnose"><td><strong>注册失败原因核查</strong><small>事实、候选原因与下一步检查</small></td><td>AMF-02</td><td>${pill('待人工确认','orange')}</td><td>10:26</td><td><button class="link" data-action="diagnose">查看结果 →</button></td></tr></tbody>`}return head('告警与工单','从异常发现到恢复验证，在同一处继续处理。',btn(icon('plus')+' 新建诊断','diagnose',true))+tabs(['告警','工单','设备','诊断任务'],state.resourceTab,'resource')+`<div class="card"><div class="toolbar"><input id="alertSearch" class="input search" placeholder="搜索告警名称或设备"><select class="input" aria-label="处理阶段"><option>未完成</option><option>待确认</option><option>处理中</option><option>全部阶段</option></select><button class="btn sm" data-action="filter">${icon('filter')} 筛选</button><span class="toolbar-end">最近 7 天 · 10:30 更新</span></div><div class="table-wrap"><table>${content}</table></div><div class="table-foot"><span>共 ${state.resourceTab==='告警'?'48':'7'} 项 · 每页 10 项</span><span class="page-num">1</span></div></div><div class="quiet-note">${icon('clock')} 条件与记录会保留，返回列表可继续处理。</div>`+footer()}
function chatPage(){let messages=state.chat.length?state.chat.map(m=>m.type==='user'?`<div class="message user">${escapeHtml(m.text)}</div>`:`<div class="message assistant"><h3>先核对范围，再判断原因</h3><p>AMF 注册失败建议先确认受影响设备、发生窗口与软件版本，再检查同一窗口内的关联事件。</p><ol><li>查看 N2 接口与 SCTP 关联状态。</li><li>对照注册请求量、成功率和近期变更。</li><li>保留支持与反对证据；资料不足时补查，不直接确认根因。</li></ol><div class="message-footer"><button class="link" data-action="sources">查看 2 处依据 →</button><button class="link" data-action="feedback">有帮助</button><button class="link" data-action="feedback">需要改进</button></div><div class="help" style="margin-top:10px">回答效果示意，未调用模型或实际知识库。</div></div>`).join(''):`<div class="welcome"><div class="ai-mark">${icon('spark')}</div><h2>从问题出发，找到可靠依据</h2><p>描述设备、故障现象或知识问题，我会帮你梳理。</p><div class="suggestions">${[['故障排查','AMF 注册失败先查什么？'],['协议知识','N2 与 N4 接口有什么区别？'],['资料核对','SCTP 关联异常怎样取证？']].map(a=>`<button data-prompt="${a[1]}"><b>${a[0]} ${icon('arrow')}</b>${a[1]}</button>`).join('')}</div></div>`;return `<div class="chat-page">${head('智能问答','回答有依据，关键结论可追溯。',btn('历史会话','history')+`<button class="icon-btn" data-action="newchat" aria-label="新建会话">${icon('plus')}</button>`)}<div class="chat-main" id="chatMain">${messages}</div><form class="composer" id="chatForm"><textarea id="chatInput" placeholder="问一个运维问题，或补充设备与故障现象…" aria-label="问题"></textarea><div class="composer-bottom"><span>当前知识库 <span style="color:#d0d8e4;margin:0 6px">·</span> 内部运维资料</span><button class="send" type="submit" aria-label="发送问题">${icon('send')}</button></div></form><div class="chat-foot">关键操作以实际设备资料与人工核对为准 · 交互稿回答仅作排版演示</div></div>`}
function queryPage(){let body;if(state.queryTab==='常用统计'){body=`<div class="query-grid">${[['活动告警','48','10.15 — 10.21 · 未处理及已确认','查看告警','alerts'],['设备在线率','99.2%','248 / 250 台 · 当前场景','查看设备','devices'],['工单待办','7','2 项待验证 · 5 项处理中','查看工单','tickets']].map(a=>`<div class="card query-stat"><div style="display:flex;justify-content:space-between"><h2>${a[0]}</h2><span style="color:#9db2d2">${icon('chart')}</span></div><strong class="stat-number">${a[1]}</strong><small>${a[2]}</small><div><button class="link" data-action="${a[4]}">${a[3]} →</button></div></div>`).join('')}</div><div class="card" style="margin-top:22px"><div class="card-head"><h2>新增告警趋势</h2><span class="small">按天 · 最近 7 天</span></div><div class="trend-wrap">${chart()}<div class="chart-labels"><span>10.15</span><span>10.17</span><span>10.19</span><span>10.21</span></div></div></div>`}else{body=`<div class="query-start"><h2>你想查什么？</h2><p>描述对象和时间，先核对条件，再查询数据。</p><form class="card query-form" id="queryForm"><textarea id="queryText" placeholder="例如：查看近 7 天未处理的紧急告警，最多 20 条" aria-label="查询描述">${state.queryReady?'近7天未处理的紧急告警，最多20条':''}</textarea><div class="query-form-footer"><span class="help">支持告警、设备、工单等业务明细</span><button class="btn primary" type="submit">生成查询 ${icon('arrow')}</button></div></form><div class="chips">${['近7天紧急告警','处理中工单','在线设备清单'].map(a=>`<button class="chip" data-query="${a}">${a}</button>`).join('')}</div>${state.queryReady?`<div class="card plan"><div style="display:flex;justify-content:space-between"><h2>确认查询条件</h2>${pill('待确认')}</div><div class="plan-fields">${[['查询对象','告警'],['时间','最近7天'],['条件','紧急 · 未处理'],['条数','最多20条']].map(a=>`<div><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</div><button class="btn primary" data-action="execute">确认并查询</button><span class="help" style="margin-left:12px">只读，不修改业务记录</span></div>`:''}${state.queryDone?`<div class="card" style="margin-top:18px;overflow:hidden"><div class="card-head"><h2>查询结果 <small style="margin-left:7px">2 条</small></h2><button clas document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const text=$('chatInput').value.trim();if(!text)return;state.chat.push({type:'user',text});render();const n=document.createElement('div');n.className='message assistant';n.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';$('chatMain').append(n);setTimeout(()=>{state.chat.push({type:'assistant'});if(state.page==='chat')render()},650)}if(e.target.id==='queryForm'){e.preventDefault();if(!$('queryText').value.trim()){toast('先描述要查询的对象与时间');return}state.queryReady=true;state.queryDone=false;render();toast('请核对查询条件后执行')}});
document.addEventListener('change',e=>{if(e.target.id==='fileInput'&&e.target.files[0]){state.filename=e.target.files[0].name;render();toast('文件仅用于展示选择效果，不上传')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.body.classList.remove('menu-open')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('[data-action="search"]').click()}if(e.target.matches?.('tr[data-alarm]')&&e.key==='Enter'){e.preventDefault();state.flow=0;flow()}if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('chatForm').requestSubmit()}if(e.key==='Tab'&&$('drawer').classList.contains('open')){const a=Array.from($('drawer').querySelectorAll('button,input,textarea,select,a[href]')).filter(n=>!n.disabled&&n.getBoundingClientRect().height>0);if(!a.length)return;const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('overlay').onclick=closeDrawer;render();
</script></body></html>
