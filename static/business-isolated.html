<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隔离只读诊断与业务工作区</title><link rel="stylesheet" href="/static/css/agent-workspace.css"><link rel="stylesheet" href="/static/css/business-workspace.css"><link rel="stylesheet" href="/static/css/readonly-theme.css"><style>body{margin:0;background:#f3f6fb;color:#1b2d47;font:15px/1.6 system-ui}*{box-sizing:border-box}textarea{max-width:100%}a{color:#315ad7}h1{font-size:24px}input,textarea{font:inherit;border:1px solid #d5dfef;border-radius:8px;padding:10px}.agent-card{overflow-wrap:anywhere}</style></head><body><main class="isolated-shell">
<header class="isolated-top"><div><h1>隔离只读工作区</h1><p id="isolatedStatus" role="status">正在检查服务与权限…</p></div><a href="http://localhost:8010/" target="_blank" rel="noopener">返回8010问答平台</a></header>
<p class="isolated-notice">仅供本地开发演示 · 已批准16条领域资料 · 历史知识版本 <strong>test-legacy-demo-r1</strong>。与8010当前版本分开；禁用生成、业务写操作和同步。快照不代表当前现场，引用不证明根因。</p>
<details class="isolated-key"><summary>设置隔离库凭据</summary><form id="isolatedKeyForm"><label>API Key <input id="isolatedKey" type="password" autocomplete="off"></label><button type="submit">保存凭据</button></form></details>
<nav class="isolated-nav" aria-label="隔离只读功能"><button id="businessTab" type="button" hidden>业务与集成</button><button id="agentTab" type="button" hidden>诊断工作台</button><button id="isolatedRefresh" type="button">重新核对权限</button></nav>
<section id="view-business" hidden><div class="business-heading"><h1>业务与集成</h1><button id="businessRefresh" type="button">刷新</button></div><p id="businessStatus" role="status"></p><p id="businessScope" class="knowledge-meta"></p><div id="businessAccess" class="business-access"></div><div id="businessControls" class="business-controls" hidden><label>记录类型 <select id="businessKind"><option value="alarms">告警</option><option value="devices">设备</option><option value="tickets">工单</option><option value="changes">变更</option><option value="integrations">集成状态</option></select></label><form id="businessFilter"><label for="businessQuery" hidden>按ID或标题筛选</label><input id="businessQuery" maxlength="100" placeholder="按ID或标题筛选"><button type="submit">查询</button></form></div><div id="businessList" class="business-list"></div><button id="businessNext" type="button" hidden>下一页</button><section id="businessDetail" class="business-detail" aria-live="polite"></section></section>
<section id="view-agent" hidden><h1>诊断工作台</h1><p id="agentAvailability" role="status"></p><form id="agentForm" class="agent-form"><label class="agent-query-label">问题<textarea id="agentQuery" rows="2" maxlength="500" required placeholder="例如：ALM-AMF-REG 常见原因"></textarea></label><label>告警事件ID（可选）<input id="agentAlarm" maxlength="64" pattern="[A-Za-z0-9_.:\-]+"></label><label>设备ID（可选）<input id="agentDevice" maxlength="64" pattern="[A-Za-z0-9_.:\-]+"></label><p class="agent-form-note">带入详情后仍需手动提交；单轮查询，不继承历史会话。</p><div class="agent-actions"><button id="agentSubmit" type="submit" disabled>开始诊断</button><button id="agentCancel" type="button" hidden>取消等待</button></div></form><div id="agentStages" class="agent-stages" role="list" aria-label="诊断阶段" hidden></div><p id="agentProgress" role="status" aria-live="polite"></p><div id="agentResult" hidden></div><section id="agentReview" class="agent-review" aria-live="polite" hidden></section></section>
</main><script src="/static/evidence-viewer.js"></script><script src="/static/agent-workspace.js"></script><script src="/static/business-workspace.js"></script><script>
const $=id=>document.getElementById(id),apiKey=()=>sessionStorage.getItem('readonly_key')||'',authHeaders=()=>({'X-API-Key':apiKey()});
const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has('local_demo_key')){sessionStorage.setItem('readonly_key',fragment.get('local_demo_key'));history.replaceState(null,'',location.pathname);}
let scopeEpoch=0,scopeController=null,allowed=false;
function switchTab(tab){BusinessWorkspace.leave();AgentWorkspace.reset();for(const name of ['business','agent'])$('view-'+name).hidden=tab!==name||!allowed;if(allowed&&tab==='business')BusinessWorkspace.load();}
async function permissions(){const token=++scopeEpoch;scopeController?.abort();scopeController=new AbortController();allowed=false;BusinessWorkspace.leave();AgentWorkspace.capability(false);AgentWorkspace.reset();for(const id of ['businessTab','agentTab','view-business','view-agent'])$(id).hidden=true;$('isolatedStatus').textContent='正在检查服务与权限…';
try{const response=await fetch('/admin/capabilities',{headers:authHeaders(),cache:'no-store',signal:scopeController.signal});if(!response.ok)throw new Error(response.status===401?'请设置已签发的隔离库凭据，或使用本机私有入口登录。':'凭据核验暂不可用，请手动刷新。');const caps=await response.json();if(token!==scopeEpoch)return;
const availability=await fetch('/business/availability',{headers:authHeaders(),cache:'no-store',signal:scopeController.signal});if(token!==scopeEpoch)return;if(!availability.ok)throw new Error(availability.status===403?'当前凭据无内部业务快照读取权限。':'隔离快照暂不可用，请手动刷新。');const value=await availability.json();if(token!==scopeEpoch)return;
allowed=Array.isArray(caps.roles)&&caps.roles.some(r=>['ops','auditor','admin'].includes(r))&&value.enabled_here===true;if(!allowed)throw new Error('当前账号没有只读工作区权限。');$('isolatedStatus').textContent='租户 '+caps.tenant_id+' · '+caps.roles.join('、')+' · 隔离只读服务已核对';$('businessTab').hidden=$('agentTab').hidden=false;AgentWorkspace.capability(true);switchTab('business');
}catch(error){if(token===scopeEpoch&&error.name!=='AbortError')$('isolatedStatus').textContent=error.message;}}
BusinessWorkspace.init({key:apiKey,headers:authHeaders,diagnose:(target,query)=>{switchTab('agent');$('agentAlarm').value=target.alarm_id||'';$('agentDevice').value=target.device_id||'';$('agentQuery').value=query;}});AgentWorkspace.init({key:apiKey,headers:authHeaders});
$('businessTab').onclick=()=>switchTab('business');$('agentTab').onclick=()=>switchTab('agent');$('isolatedRefresh').onclick=permissions;$('isolatedKeyForm').onsubmit=e=>{e.preventDefault();const key=$('isolatedKey').value.trim();if(key)sessionStorage.setItem('readonly_key',key);else sessionStorage.removeItem('readonly_key');$('isolatedKey').value='';$('businessQuery').value='';permissions();};window.addEventListener('storage',e=>{if(e.key==='readonly_key'||e.key===null)permissions();});permissions();
</script></body></html>
