<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隔离版本流程验收</title><style>body{font:15px/1.6 system-ui;color:#18304d;background:#f4f7fb;margin:0}main{max-width:1150px;margin:auto;padding:24px}nav,section{background:white;padding:20px;border:1px solid #dce5ef;border-radius:12px;margin:14px 0}button,input,select{font:inherit;padding:8px 12px;margin:5px;border:1px solid #bdcce0;border-radius:8px;max-width:100%;box-sizing:border-box}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace}.context-error{color:#9a3f10}p,h2,summary{overflow-wrap:anywhere}.knowledge-card{border:1px solid #dae4ef;padding:14px;margin:12px 0;border-radius:10px}.business-heading{display:flex;justify-content:space-between;gap:10px}#versionList select{width:100%;margin:0}#versionHistory{overflow-wrap:anywhere}@media(max-width:600px){main{padding:10px}section,nav{padding:12px}.business-heading{display:block}}</style></head><body><main><nav><strong>隔离版本流程验收</strong><p>一次性已批准模拟资料子集；强鉴权、零生成。不是完整知识库，也不切换8010。</p><div id="versionNavHeading" hidden>知识治理</div><button class="nav-item" data-tab="versions" hidden>版本与发布</button><input id="credential" type="password" autocomplete="off" placeholder="本次隔离凭据" aria-label="本次隔离凭据"><button id="credentialApply">设置凭据</button></nav><section id="view-versions" class="active"><div class="business-heading"><h1>版本与发布</h1><button id="versionRefresh">刷新</button></div><p id="versionStatus" role="status" aria-live="polite"></p><div id="versionList"></div><section id="versionDetail" aria-live="polite"></section><details><summary>已提交发布与回滚账本</summary><div id="versionHistory"></div></details></section></main><script src="/static/version-workspace.js"></script><script>const key=()=>sessionStorage.getItem('version_fixture_key')||'';VersionWorkspace.init({key,headers:()=>({'X-API-Key':key()})});function authenticate(){VersionWorkspace.credentialsChanged();VersionWorkspace.load()}document.getElementById('credentialApply').onclick=()=>{sessionStorage.setItem('version_fixture_key',document.getElementById('credential').value);document.getElementById('credential').value='';authenticate()};authenticate();</script></body></html>
